<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin portal — James Laser Hair Removal for Men</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f2238">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap wide" style="max-width:none">
      <div style="display:flex;align-items:center;gap:.75rem">
        <button class="menu-btn" id="menubtn" aria-label="Menu">☰</button>
        <div class="brand">
          <strong>Admin portal</strong>
          <span>James Laser Hair Removal for Men</span>
        </div>
      </div>
      <div id="userbox" class="hidden" style="display:flex;gap:.6rem;align-items:center;font-size:.85rem">
        <span id="useremail" style="opacity:.8"></span>
        <button class="btn ghost sm" id="logout" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
      </div>
    </div>
  </header>

  <!-- Login -->
  <section id="login" class="wrap">
    <form class="card login" id="loginform">
      <h2>Sign in</h2>
      <p class="muted">Admin access only.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="loginmsg" class="alert error hidden"></div>
      <button class="btn block" type="submit">Sign in</button>
      <p class="muted" style="margin-top:.75rem;font-size:.8rem"><a href="#" id="forgot">Forgot password?</a></p>
    </form>
  </section>

  <!-- Portal -->
  <div id="app" class="portal hidden">
    <nav class="side" id="side">
      <a href="#dashboard" data-page="dashboard">Dashboard</a>
      <div class="sec">Appointments</div>
      <a href="#requests" data-page="requests" class="sub">Requests <span class="n hidden" id="n_requests"></span></a>
      <a href="#appointments" data-page="appointments" class="sub">Appointments &amp; Invoices</a>
      <a href="#patients" data-page="patients" class="sub">Patients</a>
      <a href="#reports" data-page="reports" class="sub">Reports</a>
      <a href="#messages" data-page="messages" class="sub">Patient Messages</a>
      <div class="sec">Clinic</div>
      <a href="#services" data-page="services">Medical Services</a>
      <div class="sec">Links</div>
      <a href="index.html" target="_blank">Public booking page ↗</a>
    </nav>
    <main class="content" id="content"></main>
  </div>

  <!-- Generic modal -->
  <div id="modal" class="modal-bg hidden"><div class="modal" id="modalbox"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
